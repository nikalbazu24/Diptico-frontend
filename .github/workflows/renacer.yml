name: Probar Díptico Renacer

on:
  push:
    branches: ['fix/diptico-renacer']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renacer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Probar navegación, biblioteca y recorridos de la nueva interfaz
        run: gradle :app:testCompletaRenacerUnitTest --tests 'cl.nikalbazu.diptico.renacer.*' --no-daemon
      - name: Compilar la edición de prueba
        run: gradle :app:assembleCompletaRenacer --no-daemon
      - name: Preparar el APK
        run: cp app/build/outputs/apk/completa/renacer/app-completa-renacer.apk Diptico-Renacer.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Diptico-Renacer
          path: |
            Diptico-Renacer.apk
            app/capturas-renacer/
            app/build/reports/tests/testCompletaRenacerUnitTest/
