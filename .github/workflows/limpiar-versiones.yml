name: Limpiar versiones viejas

# Se ejecuta a mano desde la pestaña Actions › "Limpiar versiones viejas" › Run workflow.
# Borra las versiones publicadas (y su etiqueta) que no estén en la lista de las que se conservan.
# La versión más nueva se conserva siempre. El historial del código no se toca.
on:
  workflow_dispatch:
    inputs:
      conservar:
        description: "Versiones que se conservan (separadas por espacio)"
        required: true
        default: "v0.1.3 v0.2.9 v0.3.10 v0.4.15 v0.5.20 v0.6.22 v0.7.28 v0.8.32 v0.9.39 v1.0-beta.59 v1.0-beta.63 v1.0-beta.69 v1.0-beta.73"
      probar:
        description: "Solo mostrar qué se borraría, sin borrar nada"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar las versiones que no se conservan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CONSERVAR: ${{ inputs.conservar }}
          PROBAR: ${{ inputs.probar }}
        run: |
          ultima=$(gh api "repos/$REPO/releases?per_page=1" -q '.[0].tag_name')
          echo "La más nueva ($ultima) se conserva siempre."
          borradas=0
          gh api --paginate "repos/$REPO/releases?per_page=100" -q '.[] | "\(.id) \(.tag_name)"' > versiones.txt
          while read -r id tag; do
            if [ "$tag" = "$ultima" ] || [[ " $CONSERVAR " == *" $tag "* ]]; then
              echo "Se conserva: $tag"
              continue
            fi
            if [ "$PROBAR" = "true" ]; then
              echo "Se borraría: $tag"
            else
              gh api -X DELETE "repos/$REPO/releases/$id" && gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" && echo "Borrada: $tag"
              borradas=$((borradas+1))
            fi
          done < versiones.txt
          echo "### Listo: $borradas versiones borradas" >> "$GITHUB_STEP_SUMMARY"
