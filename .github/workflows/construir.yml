name: Construir APK

on:
  push:
    branches: [main, 'fix/**', 'release/**']
    # Cambios solo de textos, imágenes del README o plantillas de GitHub no crean una versión nueva.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/limpiar-versiones.yml"
  workflow_dispatch:
    inputs:
      preparar_firma:
        description: Crear un borrador con los APK firmados para probar en la consola
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    # Escribir solo para poder leer el borrador privado con el kit de Discord (GitHub no deja leer borradores con menos).
    permissions:
      contents: write
    env:
      DIPTICO_REPORTES_URL: ${{ vars.DIPTICO_REPORTES_URL }}
      FIRMAR: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/2.0.0' || github.ref == 'refs/heads/fix/153-liquid-glass' || github.ref == 'refs/heads/fix/apk-prueba-integrada-2-0-0') && (github.event_name == 'push' || inputs.preparar_firma) }}
    outputs:
      numero: ${{ steps.paquete.outputs.numero }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # El kit de Discord no va en el repositorio (su licencia no deja publicarlo): Nicolás lo guarda como archivo
      # de un borrador privado de GitHub («kit-discord»), que solo ven los dueños del repositorio y GitHub Actions.
      - name: Traer el kit de Discord
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.tag_name == "kit-discord") | .assets[] | select(.name == "discord_partner_sdk.aar") | .id][0] // empty' || true)
          if [ -z "$id" ]; then echo "::warning::Sin el borrador kit-discord: Díptico se compila sin el kit de Discord."; exit 0; fi
          mkdir -p app/discord
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > app/discord/discord_partner_sdk.aar
          ls -la app/discord

      - name: Determinar nombre de versión
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0.0" >/dev/null 2>&1; then
              nombre="2.0.1-beta.$GITHUB_RUN_NUMBER"
            else
              nombre="2.0.0"
            fi
          elif [[ "$GITHUB_REF" == "refs/heads/fix/apk-prueba-integrada-2-0-0" ]]; then
            nombre="2.0.0-pruebas.$GITHUB_RUN_NUMBER"
          elif [[ "$GITHUB_REF" == "refs/heads/release/2.0.0" ]]; then
            nombre="2.0.0-rc.$GITHUB_RUN_NUMBER"
          elif [[ "$FIRMAR" == "true" ]]; then
            nombre="1.1-beta.$GITHUB_RUN_NUMBER"
          else
            nombre="1.0-beta.$GITHUB_RUN_NUMBER"
          fi
          printf 'DIPTICO_VERSION_NAME=%s\n' "$nombre" >> "$GITHUB_ENV"
          printf 'nombre=%s\n' "$nombre" >> "$GITHUB_OUTPUT"
          echo "Versión de esta compilación: $nombre"

      - name: Probar perfiles, navegación y estabilidad
        run: gradle :app:testCompletaDebugUnitTest --tests "cl.nikalbazu.diptico.ExperienciaTest" --tests "cl.nikalbazu.diptico.NavegacionTest" --tests "cl.nikalbazu.diptico.EstabilidadTest" --tests "cl.nikalbazu.diptico.DensidadGlassTest" --tests "cl.nikalbazu.diptico.Revision153Test" --tests "cl.nikalbazu.diptico.WidgetsAdaptablesTest" --tests "cl.nikalbazu.diptico.CajasLocalesTest" --tests "cl.nikalbazu.diptico.RecorridoTest" --tests "cl.nikalbazu.diptico.TourInteractivoTest" --tests "cl.nikalbazu.diptico.ActualizadorCanalesTest" --no-daemon

      - name: Probar distribución del Home de una pantalla
        if: github.ref == 'refs/heads/fix/apk-prueba-integrada-2-0-0'
        run: |
          gradle :app:testCompletaDebugUnitTest \
            --tests "cl.nikalbazu.diptico.Capturas.t476b_cv_carpetas_una_compacta" \
            --tests "cl.nikalbazu.diptico.Capturas.t476c_cv_dock_lateral_fijo" \
            --tests "cl.nikalbazu.diptico.Capturas.t476d_cv_sin_partidas_no_muestra_barra" \
            --no-daemon

      - name: Compilar y verificar firma de distribución
        if: env.FIRMAR == 'true'
        env:
          FIRMA_BASE64: ${{ secrets.DIPTICO_KEYSTORE_BASE64 }}
          DIPTICO_STORE_PASSWORD: ${{ secrets.DIPTICO_STORE_PASSWORD }}
          DIPTICO_KEY_ALIAS: ${{ secrets.DIPTICO_KEY_ALIAS }}
          DIPTICO_KEY_PASSWORD: ${{ secrets.DIPTICO_KEY_PASSWORD }}
          DIPTICO_CERT_SHA256: ${{ vars.DIPTICO_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$FIRMA_BASE64" || -z "$DIPTICO_STORE_PASSWORD" || -z "$DIPTICO_KEY_ALIAS" || -z "$DIPTICO_KEY_PASSWORD" ]]; then
            echo "::error::Falta al menos un secreto de firma en el repositorio."
            exit 1
          fi
          if [[ ! "$DIPTICO_CERT_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::DIPTICO_CERT_SHA256 debe contener 64 dígitos hexadecimales en minúsculas."
            exit 1
          fi
          umask 077
          DIPTICO_KEYSTORE="$(mktemp)"
          export DIPTICO_KEYSTORE
          trap 'rm -f "$DIPTICO_KEYSTORE"' EXIT
          if ! printf '%s' "$FIRMA_BASE64" | base64 --decode > "$DIPTICO_KEYSTORE"; then
            echo "::error::DIPTICO_KEYSTORE_BASE64 no contiene un archivo en Base64 válido."
            exit 1
          fi
          unset FIRMA_BASE64
          if ! huella_clave="$(keytool -exportcert -keystore "$DIPTICO_KEYSTORE" -storepass:env DIPTICO_STORE_PASSWORD -alias "$DIPTICO_KEY_ALIAS" | sha256sum | awk '{print $1}')"; then
            echo "::error::No se pudo leer el certificado del almacén. Revisa el archivo, la contraseña y el alias."
            exit 1
          fi
          if [[ "$huella_clave" != "$DIPTICO_CERT_SHA256" ]]; then
            echo "::error::DIPTICO_CERT_SHA256 no coincide con el certificado de la clave cargada."
            exit 1
          fi
          gradle :app:assembleRelease --no-daemon
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          if [[ ! -x "$apksigner" ]]; then
            echo "::error::No se encontró apksigner en el SDK de Android."
            exit 1
          fi
          for variante in completa movil; do
            apk="app/build/outputs/apk/$variante/release/app-$variante-release.apk"
            if ! informe="$("$apksigner" verify --print-certs "$apk")"; then
              echo "::error::Android no pudo verificar la firma del APK $variante."
              exit 1
            fi
            if grep -qi 'certificate DN:.*Android Debug' <<< "$informe"; then
              echo "::error::El APK $variante tiene un certificado de depuración."
              exit 1
            fi
            certificado="$(awk '/certificate SHA-256 digest:/ { print tolower($NF) }' <<< "$informe" | sort -u)"
            if [[ "$certificado" != "$DIPTICO_CERT_SHA256" ]]; then
              echo "::error::El certificado del APK $variante no coincide con la huella de distribución."
              exit 1
            fi
            echo "Firma de distribución verificada para $variante."
          done

      - name: Compilar Díptico
        if: env.FIRMAR != 'true'
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee compilar.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A1 compilar.log | head -60 | while IFS= read -r l; do echo "::error::${l}"; done

      - name: Nombrar los APK
        id: paquete
        run: |
          numero="$DIPTICO_VERSION_NAME"
          cp app/build/outputs/apk/completa/release/app-completa-release.apk "Diptico-Pruebas-Completa-v$numero.apk"
          cp app/build/outputs/apk/movil/release/app-movil-release.apk "Diptico-Pruebas-Movil-v$numero.apk"
          printf 'numero=%s\n' "$numero" >> "$GITHUB_OUTPUT"

      - name: Sacar fotos de las pantallas
        if: github.ref != 'refs/heads/fix/apk-prueba-integrada-2-0-0'
        run: gradle :app:testCompletaDebugUnitTest --tests "cl.nikalbazu.diptico.Capturas" --no-daemon

      - name: Juntar las fotos
        if: always()
        run: |
          if [ -d app/capturas ]; then cd app && zip -qr "../Capturas-v1.0-beta.${{ github.run_number }}.zip" capturas; fi
          ls -la

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Diptico-Pruebas-APK
          path: |
            Diptico-*.apk
            Capturas-*.zip
            app/build/reports/tests/

  gestos_widgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Probar los gestos del editor
        run: gradle :app:testCompletaDebugUnitTest --tests "cl.nikalbazu.diptico.EditorWidgetsTest" --no-daemon

  publicar_pruebas:
    # Únicamente el paquete independiente "Díptico Pruebas". Nunca publicar aquí la APK oficial.
    needs: [apk, gestos_widgets]
    if: github.ref == 'refs/heads/fix/apk-prueba-integrada-2-0-0' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Diptico-Pruebas-APK
          path: distribucion

      - name: Comprobar versiones, paquetes y ambos APK de Pruebas
        env:
          VERSION: ${{ needs.apk.outputs.numero }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          [[ "$VERSION" == "2.0.0-pruebas.$RUN_NUMBER" ]]
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          test -x "$aapt"
          for variante in Completa Movil; do
            apk="distribucion/Diptico-Pruebas-${variante}-v${VERSION}.apk"
            test -s "$apk"
            datos="$("$aapt" dump badging "$apk" | head -n1)"
            [[ "$datos" == *"name='cl.nikalbazu.diptico.pruebas'"* ]]
            [[ "$datos" == *"versionCode='${RUN_NUMBER}'"* ]]
            [[ "$datos" == *"versionName='${VERSION}'"* ]]
            echo "APK Pruebas verificada: $variante / $VERSION"
          done

      - name: Publicar actualización de Díptico Pruebas
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.apk.outputs.numero }}
          target_commitish: ${{ github.sha }}
          name: Díptico Pruebas v${{ needs.apk.outputs.numero }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            distribucion/Diptico-Pruebas-Completa-v${{ needs.apk.outputs.numero }}.apk
            distribucion/Diptico-Pruebas-Movil-v${{ needs.apk.outputs.numero }}.apk
          body: |
            ## Díptico Pruebas — canal experimental separado
            Compilación automática ${{ github.run_number }}: pruebas de navegación, estabilidad,
            gestos del editor y firma de distribución aprobadas.
            Estas APK usan el identificador Android cl.nikalbazu.diptico.pruebas
            y NO reemplazan ni actualizan Díptico Oficial.
            La app de pruebas detecta futuras versiones de este mismo canal
            desde Menú › Acerca de › Actualizaciones, o mediante revisión automática.
            - **Completa:** consolas Android.
            - **Móvil:** teléfonos Android.
            Se recomienda respaldar ajustes y partidas antes de actualizar.

  capturas_revision:
    # Solo en la rama de revisión: deja las fotos en un borrador para revisarlas sin descargar artefactos.
    needs: [apk]
    if: github.ref == 'refs/heads/fix/revision-capturas'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Diptico-APK
          path: distribucion
      - name: Subir las fotos a un borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(find distribucion -name 'Capturas-*.zip' | head -1)
          test -n "$zip"
          apks=$(find distribucion -name 'Diptico-*.apk' | tr '\n' ' ')
          gh release delete revision-capturas --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create revision-capturas "$zip" $apks --draft --title "Revisión de capturas" --notes "Borrador temporal para revisar las pantallas." --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY"

  distribuir_beta:
    needs: [apk, gestos_widgets]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.preparar_firma)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Diptico-APK
          path: distribucion

      - name: Revisar el tour y preparar las notas de la beta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_BETA: v${{ needs.apk.outputs.numero }}
        run: |
          set -euo pipefail
          ruta=app/src/main/java/cl/nikalbazu/diptico/estado/Novedades.kt
          leer_archivo() {
            gh api "repos/$GITHUB_REPOSITORY/contents/$1?ref=$2" --jq .content | base64 -d
          }
          id_tour() {
            sed -n 's/^[[:space:]]*const val ID = "\([^"]*\)".*/\1/p'
          }

          actual=$(leer_archivo "$ruta" "$GITHUB_SHA" | id_tour)
          test -n "$actual"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            anterior=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" |
              jq -r --arg tag "$TAG_BETA" 'map(select(.draft == false and ((.tag_name | startswith("v1.1-beta.")) or (.tag_name | startswith("v2."))) and .tag_name != $tag))[0].tag_name // empty')
            if [[ -n "$anterior" && "$actual" == "$(leer_archivo "$ruta" "$anterior" | id_tour)" ]]; then
              echo "::error::Actualiza el ID y las páginas de Novedades antes de publicar otra beta."
              exit 1
            fi
          fi

          leer_archivo docs/novedades-beta.md "$GITHUB_SHA" > notas-beta.md
          test -s notas-beta.md
          cat >> notas-beta.md <<'EOF'

          **Español.** APK normal para consolas Android y APK «-movil» para teléfonos.
          [Guía de migración y firma](https://github.com/nikalbazu24/Diptico-frontend/blob/main/docs/distribucion.md).

          **English.** Use the regular APK for Android handhelds and the «-movil» APK for phones.
          EOF

      - name: Publicar beta o guardar borrador manual
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.apk.outputs.numero }}
          target_commitish: ${{ github.sha }}
          name: Díptico v${{ needs.apk.outputs.numero }}
          prerelease: ${{ needs.apk.outputs.numero != '2.0.0' }}
          draft: ${{ github.event_name != 'push' }}
          fail_on_unmatched_files: true
          files: |
            distribucion/**/Diptico-v${{ needs.apk.outputs.numero }}.apk
            distribucion/**/Diptico-v${{ needs.apk.outputs.numero }}-movil.apk
          body_path: notas-beta.md

      # Las versiones 1.1 ya instaladas solo reconocen etiquetas v1.1-beta.N.
      # Este puente expone los MISMOS APK firmados de la 2.0.0 sin cambiar su versión interna.
      - name: Publicar puente de actualización para betas 1.1
        if: needs.apk.outputs.numero == '2.0.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-beta.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Actualización compatible a Díptico 2.0.0
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            distribucion/**/Diptico-v2.0.0.apk
            distribucion/**/Diptico-v2.0.0-movil.apk
          body: |
            Puente de actualización para instalaciones del canal 1.1 beta.
            Contiene los mismos APK firmados de Díptico 2.0.0.
            No es una versión diferente de la aplicación.

  publicar_candidata:
    # Las candidatas se publican en Releases, sin mover main ni marcar 2.0.0 estable.
    # Solo cuando aprobaron las pruebas y la compilación firmada de la rama release.
    needs: [apk, gestos_widgets]
    if: github.ref == 'refs/heads/release/2.0.0' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Diptico-APK
          path: distribucion

      - name: Confirmar los dos APK firmados de la candidata
        env:
          VERSION: ${{ needs.apk.outputs.numero }}
        run: |
          set -euo pipefail
          [[ "$VERSION" == 2.0.0-rc.* ]]
          consola=$(find distribucion -type f -name "Diptico-v$VERSION.apk" | head -1)
          movil=$(find distribucion -type f -name "Diptico-v$VERSION-movil.apk" | head -1)
          test -s "$consola"
          test -s "$movil"
          echo "APK de consola: $consola"
          echo "APK móvil: $movil"

      - name: Publicar candidata Díptico 2.0.0 en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.apk.outputs.numero }}
          target_commitish: ${{ github.sha }}
          name: Díptico v${{ needs.apk.outputs.numero }} — candidata
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            distribucion/**/Diptico-v${{ needs.apk.outputs.numero }}.apk
            distribucion/**/Diptico-v${{ needs.apk.outputs.numero }}-movil.apk
          body: |
            **Versión candidata de Díptico 2.0.0, no publicación estable.**
            
            Integra Colección viva y Revisión de capturas, más las correcciones
            para que los dos joysticks naveguen exclusivamente por «Tu espacio»,
            su Galería y sus opciones, y para que el contorno de widgets tenga
            esquinas redondeadas consistentes.
            
            **Descarga:** APK normal para consolas Android ARM64 de una o dos pantallas;
            APK con sufijo «-movil» para teléfonos.
            
            **Antes de instalar:** respalda ajustes y partidas. Esta candidata se
            compiló con la firma de distribución, pero falta comprobar en una consola
            real el mando, las dos pantallas y la actualización sobre instalaciones
            anteriores. No desinstales tu versión actual sin un respaldo verificable.
