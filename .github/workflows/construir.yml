name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar Díptico
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee compilar.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A1 compilar.log | head -60 | while IFS= read -r l; do echo "::error::${l}"; done

      - name: Nombrar el APK
        run: cp app/build/outputs/apk/release/app-release.apk "Diptico-v0.8.${{ github.run_number }}.apk"

      - name: Sacar fotos de las pantallas
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --tests "cl.nikalbazu.diptico.Capturas" --no-daemon

      - name: Juntar las fotos
        if: always()
        run: |
          if [ -d app/capturas ]; then cd app && zip -qr "../Capturas-v0.8.${{ github.run_number }}.zip" capturas; fi
          ls -la

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Diptico-APK
          path: |
            Diptico-*.apk
            Capturas-*.zip
            app/build/reports/tests/

      - name: Publicar versión para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.${{ github.run_number }}
          name: Díptico v0.8.${{ github.run_number }}
          prerelease: true
          files: |
            Diptico-*.apk
            Capturas-*.zip
          body: |
            Descarga el archivo **Diptico-v0.8.${{ github.run_number }}.apk** desde la Thor e instálalo.
            Si Android lo pide, permite instalar apps desde el navegador.
