name: Construir APK

on:
  push:
    branches: [main]
    # Cambios solo de textos, imágenes del README o plantillas de GitHub no crean una versión nueva.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/limpiar-versiones.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar Díptico
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee compilar.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A1 compilar.log | head -60 | while IFS= read -r l; do echo "::error::${l}"; done

      - name: Nombrar los APK
        run: |
          cp app/build/outputs/apk/completa/release/app-completa-release.apk "Diptico-v1.0-beta.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/movil/release/app-movil-release.apk "Diptico-v1.0-beta.${{ github.run_number }}-movil.apk"

      - name: Sacar fotos de las pantallas
        continue-on-error: true
        run: gradle :app:testCompletaDebugUnitTest --tests "cl.nikalbazu.diptico.Capturas" --no-daemon

      - name: Juntar las fotos
        if: always()
        run: |
          if [ -d app/capturas ]; then cd app && zip -qr "../Capturas-v1.0-beta.${{ github.run_number }}.zip" capturas; fi
          ls -la

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Diptico-APK
          path: |
            Diptico-*.apk
            Capturas-*.zip
            app/build/reports/tests/

      - name: Publicar versión para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-beta.${{ github.run_number }}
          name: Díptico v1.0-beta.${{ github.run_number }}
          prerelease: true
          files: |
            Diptico-*.apk
            Capturas-*.zip
          body: |
            **English:** on a console (AYN Thor, Odin, Retroid…) install **Diptico-v1.0-beta.${{ github.run_number }}.apk**. On a phone, install **Diptico-v1.0-beta.${{ github.run_number }}-movil.apk** (Google Play Protect blocks the full version on phones). Found a bug? [Report it here](https://github.com/Nikalbazu24/diptico-frontend/issues/new/choose).

            **Español:** descarga el archivo **Diptico-v1.0-beta.${{ github.run_number }}.apk** desde la Thor (o la consola) e instálalo.
            En un teléfono usa **Diptico-v1.0-beta.${{ github.run_number }}-movil.apk** (Google Play Protect bloquea la versión completa en teléfonos).
            Si Android lo pide, permite instalar apps desde el navegador.
