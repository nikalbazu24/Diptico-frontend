name: Construir APK

on:
  push:
    branches: [main, 'fix/**']
    # Cambios solo de textos, imágenes del README o plantillas de GitHub no crean una versión nueva.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/limpiar-versiones.yml"
  workflow_dispatch:
    inputs:
      preparar_firma:
        description: Crear un borrador con los APK firmados para probar en la consola
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      DIPTICO_REPORTES_URL: ${{ vars.DIPTICO_REPORTES_URL }}
      FIRMAR: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.preparar_firma) }}
    outputs:
      numero: ${{ steps.paquete.outputs.numero }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Probar perfiles, navegación y editor
        run: gradle :app:testCompletaDebugUnitTest --tests "cl.nikalbazu.diptico.ExperienciaTest" --tests "cl.nikalbazu.diptico.NavegacionTest" --tests "cl.nikalbazu.diptico.EditorWidgetsTest" --tests "cl.nikalbazu.diptico.EstabilidadTest" --no-daemon

      - name: Compilar y verificar firma de distribución
        if: env.FIRMAR == 'true'
        env:
          FIRMA_BASE64: ${{ secrets.DIPTICO_KEYSTORE_BASE64 }}
          DIPTICO_STORE_PASSWORD: ${{ secrets.DIPTICO_STORE_PASSWORD }}
          DIPTICO_KEY_ALIAS: ${{ secrets.DIPTICO_KEY_ALIAS }}
          DIPTICO_KEY_PASSWORD: ${{ secrets.DIPTICO_KEY_PASSWORD }}
          DIPTICO_CERT_SHA256: ${{ vars.DIPTICO_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$FIRMA_BASE64" || -z "$DIPTICO_STORE_PASSWORD" || -z "$DIPTICO_KEY_ALIAS" || -z "$DIPTICO_KEY_PASSWORD" ]]; then
            echo "::error::Falta al menos un secreto de firma en el repositorio."
            exit 1
          fi
          if [[ ! "$DIPTICO_CERT_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::DIPTICO_CERT_SHA256 debe contener 64 dígitos hexadecimales en minúsculas."
            exit 1
          fi
          umask 077
          DIPTICO_KEYSTORE="$(mktemp)"
          export DIPTICO_KEYSTORE
          trap 'rm -f "$DIPTICO_KEYSTORE"' EXIT
          if ! printf '%s' "$FIRMA_BASE64" | base64 --decode > "$DIPTICO_KEYSTORE"; then
            echo "::error::DIPTICO_KEYSTORE_BASE64 no contiene un archivo en Base64 válido."
            exit 1
          fi
          unset FIRMA_BASE64
          if ! huella_clave="$(keytool -exportcert -keystore "$DIPTICO_KEYSTORE" -storepass:env DIPTICO_STORE_PASSWORD -alias "$DIPTICO_KEY_ALIAS" | sha256sum | awk '{print $1}')"; then
            echo "::error::No se pudo leer el certificado del almacén. Revisa el archivo, la contraseña y el alias."
            exit 1
          fi
          if [[ "$huella_clave" != "$DIPTICO_CERT_SHA256" ]]; then
            echo "::error::DIPTICO_CERT_SHA256 no coincide con el certificado de la clave cargada."
            exit 1
          fi
          gradle :app:assembleRelease --no-daemon
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          if [[ ! -x "$apksigner" ]]; then
            echo "::error::No se encontró apksigner en el SDK de Android."
            exit 1
          fi
          for variante in completa movil; do
            apk="app/build/outputs/apk/$variante/release/app-$variante-release.apk"
            if ! informe="$("$apksigner" verify --print-certs "$apk")"; then
              echo "::error::Android no pudo verificar la firma del APK $variante."
              exit 1
            fi
            if grep -qi 'certificate DN:.*Android Debug' <<< "$informe"; then
              echo "::error::El APK $variante tiene un certificado de depuración."
              exit 1
            fi
            certificado="$(awk '/certificate SHA-256 digest:/ { print tolower($NF) }' <<< "$informe" | sort -u)"
            if [[ "$certificado" != "$DIPTICO_CERT_SHA256" ]]; then
              echo "::error::El certificado del APK $variante no coincide con la huella de distribución."
              exit 1
            fi
            echo "Firma de distribución verificada para $variante."
          done

      - name: Compilar Díptico
        if: env.FIRMAR != 'true'
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee compilar.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A1 compilar.log | head -60 | while IFS= read -r l; do echo "::error::${l}"; done

      - name: Nombrar los APK
        id: paquete
        run: |
          base="1.0"
          if [ "$FIRMAR" = true ]; then base="1.1"; fi
          numero="$base-beta.$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/completa/release/app-completa-release.apk "Diptico-v$numero.apk"
          cp app/build/outputs/apk/movil/release/app-movil-release.apk "Diptico-v$numero-movil.apk"
          printf 'numero=%s\n' "$numero" >> "$GITHUB_OUTPUT"

      - name: Sacar fotos de las pantallas
        run: gradle :app:testCompletaDebugUnitTest --tests "cl.nikalbazu.diptico.Capturas" --no-daemon

      - name: Juntar las fotos
        if: always()
        run: |
          if [ -d app/capturas ]; then cd app && zip -qr "../Capturas-v1.0-beta.${{ github.run_number }}.zip" capturas; fi
          ls -la

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Diptico-APK
          path: |
            Diptico-*.apk
            Capturas-*.zip
            app/build/reports/tests/

  distribuir_beta:
    needs: apk
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.preparar_firma)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Diptico-APK
          path: distribucion

      - name: Publicar beta o guardar borrador manual
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.apk.outputs.numero }}
          target_commitish: ${{ github.sha }}
          name: Díptico v${{ needs.apk.outputs.numero }}
          prerelease: true
          draft: ${{ github.event_name != 'push' }}
          fail_on_unmatched_files: true
          files: |
            distribucion/**/Diptico-v${{ needs.apk.outputs.numero }}.apk
            distribucion/**/Diptico-v${{ needs.apk.outputs.numero }}-movil.apk
          body: |
            **Español.** Descarga el APK normal para consolas Android o el APK «-movil» para teléfonos.
            Si vienes de una beta 1.0, exporta y verifica un respaldo de Díptico antes de migrar.
            [Guía de migración y firma](https://github.com/nikalbazu24/Diptico-frontend/blob/main/docs/distribucion.md).

            **English.** Use the regular APK for Android handhelds and the «-movil» APK for phones.
            If you use a 1.0 beta, export and verify your backup before migrating.
